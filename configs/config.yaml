camera:
  # side_by_side: one device outputting (2*width) x height, left half = left eye
  # dual:         two separate devices
  # folder:       offline image pairs in <folder>/left/*.png and <folder>/right/*.png
  mode: dual
  device: 0
  # Port-based paths survive re-plugging; both cameras share one serial, so by-id is unusable.
  left_device: /dev/v4l/by-path/pci-0000:67:00.4-usb-0:1.4:1.0-video-index0   # video4
  right_device: /dev/v4l/by-path/pci-0000:67:00.4-usb-0:1.1:1.0-video-index0  # video6
  folder: data/captures/sample
  width: 640          # per eye
  height: 480
  fps: 30
  fourcc: MJPG
  swap_lr: false      # set true if left/right come out swapped

calibration:
  # ChArUco board: counts are squares, not inner corners
  squares_x: 6
  squares_y: 7
  square_size_mm: 30.0
  marker_size_mm: 20.7
  aruco_dict: DICT_5X5_100
  min_corners: 6      # per view
  fix_k3: true        # avoid overfitting k3 when corners do not reach the image edges
  expected_baseline_mm: 100.0
